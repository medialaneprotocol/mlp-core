version: "3.8"
services:
  mlp-core:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - RUST_LOG=info
    healthcheck:
      test: ["CMD", "mlp-core", "limits", "--json"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
