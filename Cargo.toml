[package]
name = "mlp-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Reference implementation of the Media Lane Protocol (MLP) core: sans-IO fragment framing, object assembly, congestion control, scheduling, and session continuity."
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/medialaneprotocol/mlp-core"
readme = "README.md"
keywords = ["media", "protocol", "transport", "realtime", "sans-io"]
categories = ["network-programming", "no-std::no-alloc"]
publish = false

[features]
default = []
# Deterministic test harness: golden traces and the lossy-link simulator.
# `serde_json` is a feature-only dependency of the simulator's scenario bodies;
# the shipped default build and its dependency closure are unchanged by it.
testing = ["dep:regex", "dep:serde_json"]

[dependencies]
serde = { version = "1", features = ["derive"] }
regex = { version = "1", optional = true }
serde_json = { version = "1", optional = true }

[dev-dependencies]
serde_json = "1"
# The integration suites drive the crate's own `testing` module, which is
# feature-gated; the dev-dependency on the package itself turns the feature on
# for tests, examples and benches only (never for a downstream build).
mlp-core = { path = ".", features = ["testing"] }

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
rust_2018_idioms = "deny"
unreachable_pub = "warn"
unused_qualifications = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
