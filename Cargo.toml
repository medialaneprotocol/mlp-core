[package]
name = "mlp-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Reference implementation of the Media Lane Protocol (MLP) core: sans-IO fragment framing, object assembly, congestion control, scheduling, and session continuity."
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/medialaneprotocol/mlp-core"
documentation = "https://docs.rs/mlp-core"
readme = "README.md"
keywords = ["media", "protocol", "transport", "realtime", "sans-io"]
categories = ["network-programming", "no-std::no-alloc"]
publish = false

[features]
default = ["cli", "pacing", "bwe", "path-selection", "resume", "input"]
# Core is always included. Extensions are optional.
pacing = []
bwe = []
path-selection = []
resume = []
input = []
cli = ["dep:serde_json"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", optional = true }

[[bin]]
name = "mlp-core"
path = "src/bin/mlp-core.rs"
required-features = ["cli"]

[dev-dependencies]
serde_json = "1"
proptest = "1"
# The core's own suites drive the harness. The harness drives the core: the
# cycle runs through a dev-dependency, which cargo allows. The patch makes
# the harness's dependency on the core resolve to *this* core, so there is
# exactly one copy of the machines in the graph and the types match.
mlp-harness = { path = "../mlp-harness" }

# The patch is what makes the cycle type-consistent: without it the harness
# would link the *published* core while the core under test is this one, and
# the two copies' types would not match. It applies only when this crate is
# the workspace root, so a consumer of the published core is unaffected.
[patch."https://github.com/medialaneprotocol/mlp-core"]
mlp-core = { path = "." }

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "deny", priority = -1 }
unreachable_pub = "warn"
unused_qualifications = "warn"

[lints.clippy]
# The default group, at a level a change cannot slip past. The pedantic
# group is not enabled wholesale: it asks for `#[must_use]` on hundreds of
# accessors and flags the deliberate numeric conversions the estimator
# makes, which would bury a real finding.
all = { level = "warn", priority = -1 }
# The pedantic lints that catch mistakes rather than style.
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
missing_const_for_fn = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
similar_names = "allow"
too_many_arguments = "allow"
# The suites build their fixtures by assigning into a defaulted value: the
# assignment is the point, and the alternative is a longer literal.
field_reassign_with_default = "allow"
# The suites compare values with their own type on both sides.
useless_conversion = "allow"
assertions_on_constants = "allow"
bool_assert_comparison = "allow"
# A borrowed expression the compiler dereferences for us.
needless_borrow = "allow"
# A counter that a loop uses as its index.
needless_range_loop = "allow"
# A counter the loop body names.
explicit_counter_loop = "allow"
